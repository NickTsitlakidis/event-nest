  "@golevelup/ts-jest": "3.0.0"
  "@nestjs/common": "11.1.29"
  "@nestjs/core": "11.1.29"
  "@nestjs/platform-express": "11.1.29"
  "@nestjs/schematics": "11.1.0"
  "@nestjs/testing": "11.1.29"
  "@nx/eslint": "23.1.2"
  "@nx/eslint-plugin": "23.1.2"
  "@nx/jest": "23.1.2"
  "@nx/js": "23.1.2"
  "@nx/nest": "23.1.2"
  "@nx/node": "23.1.2"
  "@nx/webpack": "23.1.2"
  "@nx/workspace": "23.1.2"
  "@playwright/test": "1.62.1"
  "@sveltejs/adapter-static": "3.0.10"
  "@sveltejs/kit": "2.70.3"
  "@sveltejs/vite-plugin-svelte": "7.3.0"
  "@sveltepress/theme-default": "8.5.1"
  "@sveltepress/vite": "1.7.0"
  "@shelf/jest-mongodb": "6.0.2"
  "@testcontainers/mssqlserver": "12.1.0"
  "@testcontainers/postgresql": "12.1.0"
  "@types/jest": "30.0.0"
  "@types/node": "22.20.1"
  "@typescript-eslint/eslint-plugin": "8.67.0"
  "@typescript-eslint/parser": "8.67.0"
  "@typescript-eslint/utils": "8.67.0"
  "class-transformer": "^0.5.1"
  "es-toolkit": "^1.45.1"
  "eslint": "10.9.1"
  "eslint-config-prettier": "10.1.8"
  "eslint-plugin-perfectionist": "5.11.0"
  "eslint-plugin-prettier": "5.5.6"
  "eslint-plugin-svelte": "3.22.0"
  "eslint-plugin-unicorn": "72.0.0"
  "expect-type": "1.4.0"
  "husky": "9.1.7"
  "jest": "30.4.2"
  "jest-environment-node": "30.4.1"
  "jest-util": "30.4.1"
  "knex": "^3.1.0"
  "mongodb": "^7.0.0"
  "nx": "23.1.2"
  "pg": "^8.14.1"
  "prettier": "3.9.6"
  "prettier-plugin-svelte": "4.1.1"
  "reflect-metadata": "0.2.2"
  "rxjs": "^7.8.0"
  "svelte": "5.57.0"
  "svelte-check": "4.7.6"
  "ts-jest": "29.4.12"
  "tedious": "20.0.0"
  "ts-node": "10.9.2"
  "tslib": "^2.3.0"
  "typescript": "6.0.3"
  "typescript-eslint": "8.67.0"
  "vite": "8.2.2"
  "webpack": "5.110.3"
  "webpack-cli": "^7.0.0"
  "webpack-dev-server": "5.2.6"

allowBuilds:
  "@nestjs/core": true
  "@parcel/watcher": false
  "@swc/core": false
  "cpu-features": true
  "less": true
  "mongodb-memory-server": true
  "nx": true
  "protobufjs": true
  "sharp": true
  "ssh2": true
  "unrs-resolver": true

# These exact versions were pinned before the pnpm 11 minimumReleaseAge guard
# existed; the entries become no-ops once the versions are >24h old and can be removed.
minimumReleaseAgeExclude:
  - "@nestjs/common@11.1.28"
  - "@nestjs/core@11.1.28"
  - "@nestjs/platform-express@11.1.28"
  - "@nestjs/testing@11.1.28"
  - "@types/node@22.20.1"
  - webpack@5.109.1 || 5.110.3
  - "@jsonjoy.com/fs-node@4.66.0"
  - "@jsonjoy.com/fs-snapshot@4.66.0"
  - "@typescript-eslint/eslint-plugin@8.66.0"
  - "@typescript-eslint/parser@8.66.0"
  - "@typescript-eslint/project-service@8.66.0"
  - "@typescript-eslint/scope-manager@8.66.0"
  - "@typescript-eslint/tsconfig-utils@8.66.0"
  - "@typescript-eslint/type-utils@8.66.0"
  - "@typescript-eslint/types@8.66.0"
  - "@typescript-eslint/typescript-estree@8.66.0"
  - "@typescript-eslint/utils@8.66.0"
  - "@typescript-eslint/visitor-keys@8.66.0"
  - typescript-eslint@8.66.0
  - "@sveltejs/load-config@0.2.2"
  - svelte-check@4.7.5
  - vite@8.2.1
