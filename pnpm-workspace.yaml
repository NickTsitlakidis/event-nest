  "@nx/eslint": "24.0.2"
  "@nx/eslint-plugin": "24.0.2"
  "@nx/jest": "24.0.2"
  "@nx/js": "24.0.2"
  "@nx/nest": "24.0.2"
  "@nx/node": "24.0.2"
  "@nx/webpack": "24.0.2"
  "@nx/workspace": "24.0.2"
