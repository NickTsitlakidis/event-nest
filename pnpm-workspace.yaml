  "svelte": "5.57.1"
  "svelte-check": "4.7.6"
  "ts-jest": "29.4.15"
  "tedious": "20.3.8"
  "ts-node": "10.9.2"
  "tslib": "^2.3.0"
  "typescript": "6.0.3"
  "typescript-eslint": "8.72.1"
  "vite": "8.3.0"
  "webpack": "5.112.2"
  "webpack-cli": "^7.0.0"
  "webpack-dev-server": "5.2.7"

# @nx/nest still declares NestJS < 12 as its peer range; it is only used for generators and works with 12.
peerDependencyRules:
  allowedVersions:
    "@nx/nest>@nestjs/common": "12"
    "@nx/nest>@nestjs/core": "12"

allowBuilds:
  "@nestjs/core": true
  "@parcel/watcher": false
  "@swc/core": false
  "cpu-features": true
  "less": true
  "mongodb-memory-server": true
  "nx": true
  "protobufjs": true
  "sharp": true
  "ssh2": true
  "unrs-resolver": true

# These exact versions were pinned before the pnpm 11 minimumReleaseAge guard
# existed; the entries become no-ops once the versions are >24h old and can be removed.
minimumReleaseAgeExclude:
  - "@types/node@22.20.1"
  - "webpack@5.109.1 || 5.110.3"
  - "@jsonjoy.com/fs-node@4.66.0"
  - "@jsonjoy.com/fs-snapshot@4.66.0"
  - "@typescript-eslint/eslint-plugin@8.66.0"
