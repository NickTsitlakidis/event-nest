  "es-toolkit": "^1.45.1"
  "eslint": "10.14.0"
  "eslint-config-prettier": "10.1.8"
  "eslint-plugin-perfectionist": "5.13.0"
  "eslint-plugin-prettier": "5.5.7"
  "eslint-plugin-svelte": "3.23.1"
  "eslint-plugin-unicorn": "76.0.0"
  "expect-type": "1.4.0"
  "husky": "9.1.7"
  "jest": "30.5.2"
  "jest-environment-node": "30.5.2"
  "jest-util": "30.5.1"
  "knex": "^3.1.0"
