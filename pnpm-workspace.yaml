  '@nx/eslint': '23.1.1'
  '@nx/eslint-plugin': '23.1.1'
  '@nx/jest': '23.1.1'
  '@nx/js': '23.1.1'
  '@nx/nest': '23.1.1'
  '@nx/node': '23.1.1'
  '@nx/webpack': '23.1.1'
  '@nx/workspace': '23.1.1'
  '@sveltejs/adapter-static': '3.0.10'
  '@sveltejs/kit': '2.70.2'
  '@sveltejs/vite-plugin-svelte': '7.2.0'
  '@sveltepress/theme-default': '7.3.4'
